name: Android Emulator Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build Debug APK & Test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Run tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8192M
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            sleep 10
            ./gradlew connectedDebugAndroidTest
            echo "Stopping screen recording..."
            kill $SCREENRECORD_PID || true
            sleep 2
            adb pull /sdcard/test-recording.mp4 test-recording.mp4 || true
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
      - name: Upload Logcat Logs
        if: always()
        run: adb logcat -d > logcat.txt || true
        continue-on-error: true
      - name: Upload Logcat Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-logs
          path: logcat.txt
      - name: Upload UI Test Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-recording
          path: test-recording.mp4
          if-no-files-found: ignore
      - name: Capture Screenshot
        if: failure()
        run: |
          adb shell screencap -p /sdcard/screen.png || true
          adb pull /sdcard/screen.png screenshot.png || true
        continue-on-error: true
      - name: Upload Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: screenshot.png
          if-no-files-found: ignore
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk