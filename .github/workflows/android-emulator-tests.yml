name: Android Emulator Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. SETUP JAVA 17
      # ─────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─────────────────────────────────────────────
      # 3. SETUP ANDROID SDK
      # ─────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ─────────────────────────────────────────────
      # 4. ENABLE KVM (Hardware Acceleration)
      # ─────────────────────────────────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ─────────────────────────────────────────────
      # 5. BUILD DEBUG APK + TEST APK
      # ─────────────────────────────────────────────
      - name: Build Debug APK & Test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # ─────────────────────────────────────────────
      # 6. RUN EMULATOR + TESTS WITH VIDEO RECORDING
      # ─────────────────────────────────────────────
      - name: Run tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8192M
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            # Wait for device to fully boot
            adb wait-for-device
            sleep 10

            # Install APKs
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

            # Grant permissions
            adb shell pm grant com.aetheria.bigtype android.permission.CAMERA || true
            adb shell pm grant com.aetheria.bigtype android.permission.RECORD_AUDIO || true

            # ── START SCREEN RECORDING ──
            echo "Starting screen recording..."
            adb shell screenrecord --time-limit 180 /sdcard/test-recording.mp4 &
            SCREENRECORD_PID=$!
            sleep 2

            # Run instrumentation tests
            ./gradlew connectedDebugAndroidTest

            # ── STOP SCREEN RECORDING ──
            echo "Stopping screen recording..."
            kill $SCREENRECORD_PID || true
            sleep 2
            adb pull /sdcard/test-recording.mp4 test-recording.mp4 || true

      # ─────────────────────────────────────────────
      # 7. UPLOAD TEST RESULTS (XML reports)
      # ─────────────────────────────────────────────
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/

      # ─────────────────────────────────────────────
      # 8. UPLOAD LOGCAT LOGS
      # ─────────────────────────────────────────────
      - name: Upload Logcat Logs
        if: always()
        run: |
          adb logcat -d > logcat.txt || true
        continue-on-error: true

      - name: Upload Logcat Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-logs
          path: logcat.txt

      # ─────────────────────────────────────────────
      # 9. UPLOAD UI TEST VIDEO RECORDING
      # ─────────────────────────────────────────────
      - name: Upload UI Test Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-recording
          path: test-recording.mp4
          if-no-files-found: ignore

      # ─────────────────────────────────────────────
      # 10. CAPTURE SCREENSHOTS (if app crashed)
      # ─────────────────────────────────────────────
      - name: Capture Screenshot
        if: failure()
        run: |
          adb shell screencap -p /sdcard/screen.png || true
          adb pull /sdcard/screen.png screenshot.png || true
        continue-on-error: true

      - name: Upload Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: screenshot.png
          if-no-files-found: ignore

      # ─────────────────────────────────────────────
      # 11. UPLOAD BUILT APK
      # ─────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk